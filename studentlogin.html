<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusTrack — Student Login</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ─────────────────────────────────────────────
       DESIGN TOKENS — identical to registration page
    ───────────────────────────────────────────── */
    :root {
      --navy:         #0f1f3d;
      --indigo:       #2d4a8a;
      --blue:         #3b66c4;
      --sky:          #5b8ef0;
      --accent:       #e8a020;
      --accent-lt:    #fdf3e0;
      --white:        #ffffff;
      --off-white:    #f7f8fc;
      --surface:      #ffffff;
      --border:       #dde3f0;
      --border-foc:   #3b66c4;
      --text-dark:    #0f1f3d;
      --text-mid:     #3a4a6b;
      --text-soft:    #7a89a8;
      --error:        #e53e3e;
      --error-bg:     #fff5f5;
      --success:      #276749;
      --success-bg:   #f0fff4;
      --success-bdr:  #9ae6b4;
      --radius-sm:    8px;
      --radius-md:    14px;
      --radius-lg:    22px;
      --shadow-card:  0 8px 40px rgba(15,31,61,0.13), 0 2px 8px rgba(15,31,61,0.07);
      --shadow-btn:   0 4px 18px rgba(59,102,196,0.38);
      --trans:        0.22s cubic-bezier(0.4,0,0.2,1);
    }

    /* ─── Reset ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--off-white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* ─── Page background (matches registration) ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 0%,   rgba(59,102,196,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 100%, rgba(232,160,32,0.08) 0%, transparent 55%),
        linear-gradient(160deg, #eef1f9 0%, #f7f8fc 50%, #fdf7ef 100%);
      z-index: -1;
    }

    /* Floating blob (animation) */
    body::after {
      content: '';
      position: fixed;
      width: 480px; height: 480px; border-radius: 50%;
      background: radial-gradient(circle, rgba(59,102,196,0.06), transparent 70%);
      top: -120px; left: -100px; z-index: -1;
      animation: blobFloat 14s ease-in-out infinite alternate;
    }

    @keyframes blobFloat {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(50px,35px) scale(1.10); }
    }

    /* ─── Second decorative blob ─────────────────── */
    .bg-blob-2 {
      position: fixed;
      width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, rgba(232,160,32,0.06), transparent 70%);
      bottom: -80px; right: -80px; z-index: -1;
      animation: blobFloat 18s ease-in-out infinite alternate-reverse;
      pointer-events: none;
    }

    /* ─── Page wrapper ─────────────────────────────── */
    .page-wrapper {
      width: 100%; max-width: 480px;
      animation: fadeUp 0.55s cubic-bezier(0.4,0,0.2,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─────────────────────────────────────────────
       CARD HEADER (dark gradient — matches reg page)
    ───────────────────────────────────────────── */
    .card-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--indigo) 60%, var(--blue) 100%);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 36px 40px 32px;
      position: relative; overflow: hidden;
    }

    /* Header decorative circles */
    .card-header::before {
      content: '';
      position: absolute;
      width: 280px; height: 280px; border-radius: 50%;
      background: rgba(255,255,255,0.04);
      top: -80px; right: -60px;
    }
    .card-header::after {
      content: '';
      position: absolute;
      width: 150px; height: 150px; border-radius: 50%;
      background: rgba(232,160,32,0.10);
      bottom: -50px; left: 24px;
    }

    /* Brand badge */
    .header-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(232,160,32,0.18);
      border: 1px solid rgba(232,160,32,0.35);
      color: var(--accent);
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.09em; text-transform: uppercase;
      padding: 5px 14px; border-radius: 40px;
      margin-bottom: 16px;
      position: relative; z-index: 1;
    }
    .header-badge svg { width: 11px; height: 11px; fill: var(--accent); }

    .card-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(24px, 5vw, 30px);
      font-weight: 800; color: var(--white);
      line-height: 1.2; letter-spacing: -0.02em;
      position: relative; z-index: 1;
    }
    .card-header h1 em { font-style: italic; color: rgba(255,255,255,0.60); font-weight: 500; }

    .card-header p {
      margin-top: 8px; font-size: 13.5px;
      color: rgba(255,255,255,0.50); font-weight: 400;
      position: relative; z-index: 1;
    }

    /* Security lock icon in header */
    .header-lock-icon {
      position: absolute; top: 32px; right: 40px;
      width: 42px; height: 42px; border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
    }
    .header-lock-icon svg { width: 20px; height: 20px; color: rgba(255,255,255,0.65); }

    /* ─────────────────────────────────────────────
       CARD BODY
    ───────────────────────────────────────────── */
    .card-body {
      background: var(--surface);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 36px 40px 40px;
    }

    /* ─────────────────────────────────────────────
       TOAST NOTIFICATION
    ───────────────────────────────────────────── */
    #toast {
      display: none;
      align-items: flex-start; gap: 11px;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500;
      margin-bottom: 22px;
      animation: toastSlide 0.28s cubic-bezier(0.4,0,0.2,1) both;
    }
    @keyframes toastSlide {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #toast.toast-success {
      background: var(--success-bg);
      border: 1.5px solid var(--success-bdr);
      color: var(--success);
    }
    #toast.toast-error {
      background: var(--error-bg);
      border: 1.5px solid #fec5c5;
      color: #c53030;
    }
    #toast svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
    #toast-msg { flex: 1; }

    /* ─────────────────────────────────────────────
       FORM FIELDS
    ───────────────────────────────────────────── */
    .form-fields { display: flex; flex-direction: column; gap: 18px; }

    .field {
      display: flex; flex-direction: column; gap: 7px;
      animation: fieldIn 0.40s cubic-bezier(0.4,0,0.2,1) both;
    }
    @keyframes fieldIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .field:nth-child(1) { animation-delay: 0.08s; }
    .field:nth-child(2) { animation-delay: 0.15s; }

    label {
      font-size: 12.5px; font-weight: 600;
      color: var(--text-mid); letter-spacing: 0.01em;
      display: flex; align-items: center; gap: 5px;
    }
    label .req { color: var(--error); font-size: 11px; }

    /* Input wrapper */
    .input-wrap { position: relative; }

    /* Icon inside input */
    .input-wrap svg.i-icon {
      position: absolute;
      left: 13px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px;
      color: var(--text-soft); pointer-events: none;
      transition: color var(--trans);
    }
    .input-wrap:focus-within svg.i-icon { color: var(--blue); }

    /* Base input */
    .input-wrap input {
      width: 100%; height: 47px;
      padding: 0 14px 0 38px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 400;
      color: var(--text-dark);
      background: var(--off-white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color var(--trans), background var(--trans), box-shadow var(--trans);
      appearance: none;
    }
    .input-wrap input::placeholder { color: #b0bbd4; }
    .input-wrap input:hover { border-color: #b8c8e8; background: #f4f6fb; }
    .input-wrap input:focus {
      border-color: var(--border-foc);
      background: var(--white);
      box-shadow: 0 0 0 3.5px rgba(59,102,196,0.12);
    }

    /* Error state */
    .input-wrap input.has-error {
      border-color: var(--error);
      background: var(--error-bg);
    }
    .input-wrap input.has-error:focus {
      box-shadow: 0 0 0 3.5px rgba(229,62,62,0.12);
    }

    /* Password toggle */
    .pwd-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-soft); padding: 3px;
      display: flex; align-items: center;
      border-radius: 5px;
      transition: color var(--trans), background var(--trans);
    }
    .pwd-toggle:hover { color: var(--blue); background: rgba(59,102,196,0.07); }
    .pwd-toggle svg { width: 16px; height: 16px; }

    /* Inline error message */
    .err-msg {
      display: none; align-items: center; gap: 4px;
      font-size: 11.5px; color: var(--error); font-weight: 500;
    }
    .err-msg.show {
      display: flex;
      animation: errSlide 0.2s ease both;
    }
    @keyframes errSlide {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .err-msg svg { width: 12px; height: 12px; flex-shrink: 0; }

    /* ─── Forgot password link ──────────────────── */
    .forgot-row {
      display: flex; justify-content: flex-end;
      margin-top: -6px;
    }
    .forgot-link {
      font-size: 12.5px; font-weight: 600;
      color: var(--blue); text-decoration: none;
      padding: 3px 6px; border-radius: 5px;
      transition: background var(--trans), color var(--trans);
    }
    .forgot-link:hover { background: rgba(59,102,196,0.08); color: var(--indigo); }

    /* ─── Submit button ─────────────────────────── */
    .btn-login {
      width: 100%; height: 52px; margin-top: 8px;
      background: linear-gradient(135deg, var(--indigo) 0%, var(--blue) 100%);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
      border: none; border-radius: var(--radius-sm);
      cursor: pointer; position: relative; overflow: hidden;
      box-shadow: var(--shadow-btn);
      display: flex; align-items: center; justify-content: center; gap: 9px;
      transition: transform var(--trans), box-shadow var(--trans), filter var(--trans);
    }
    /* Shimmer overlay */
    .btn-login::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.13), transparent);
      opacity: 0; transition: opacity var(--trans);
    }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(59,102,196,0.50);
      filter: brightness(1.08);
    }
    .btn-login:hover:not(:disabled)::before { opacity: 1; }
    .btn-login:active:not(:disabled) { transform: translateY(0); box-shadow: var(--shadow-btn); }
    .btn-login:disabled { opacity: 0.78; cursor: not-allowed; }

    /* Click ripple */
    .btn-login .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.22);
      transform: scale(0); animation: rippleAnim 0.5s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(3.5); opacity: 0; }
    }

    /* Button spinner */
    .btn-spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-login.loading .btn-label { display: none; }
    .btn-login.loading .btn-spinner { display: block; }

    /* ─── Divider ───────────────────────────────── */
    .divider {
      display: flex; align-items: center; gap: 14px;
      margin: 22px 0 18px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .divider span { font-size: 11.5px; color: #c0cadf; font-weight: 500; white-space: nowrap; }

    /* ─── Footer link ────────────────────────────── */
    .card-footer {
      text-align: center;
      font-size: 13.5px; color: var(--text-soft);
    }
    .card-footer a {
      color: var(--blue); font-weight: 600;
      text-decoration: none; position: relative;
      transition: color var(--trans);
    }
    .card-footer a::after {
      content: ''; position: absolute;
      bottom: -1px; left: 0; right: 0; height: 1.5px;
      background: var(--blue); transform: scaleX(0);
      transform-origin: left; transition: transform var(--trans);
    }
    .card-footer a:hover { color: var(--indigo); }
    .card-footer a:hover::after { transform: scaleX(1); }

    /* ─── Trust strip ────────────────────────────── */
    .trust-strip {
      display: flex; align-items: center; justify-content: center; gap: 20px;
      margin-top: 26px; padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .trust-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 11.5px; color: var(--text-soft); font-weight: 500;
    }
    .trust-item svg { width: 13px; height: 13px; color: #a0b0cc; }

    /* ─── Responsive ─────────────────────────────── */
    @media (max-width: 540px) {
      .card-header { padding: 26px 22px 22px; }
      .card-body { padding: 24px 22px 30px; }
      .header-lock-icon { display: none; }
      .trust-strip { gap: 12px; }
    }
  </style>
</head>
<body>

<!-- Background blob 2 -->
<div class="bg-blob-2" aria-hidden="true"></div>

<!-- ───────────────────────────────────────────────
     PAGE WRAPPER
─────────────────────────────────────────────── -->
<div class="page-wrapper" role="main">

  <!-- ── Card Header ────────────────────────── -->
  <div class="card-header" aria-hidden="true">

    <div class="header-lock-icon">
      <!-- Lock icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <div class="header-badge">
      <!-- Shield fill icon -->
      <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 2L3 5v5c0 4.418 3.134 8.56 7 9.95C13.866 18.56 17 14.418 17 10V5l-7-3z"/>
      </svg>
      Secure Portal
    </div>

    <h1>Welcome back<br><em>Sign in to continue</em></h1>
    <p>Enter your credentials to access your CampusTrack account.</p>
  </div>

  <!-- ── Card Body ──────────────────────────── -->
  <div class="card-body">

    <!-- Toast Notification -->
    <div id="toast" role="alert" aria-live="assertive"></div>

    <form id="loginForm" novalidate autocomplete="on">
      <div class="form-fields">

        <!-- Register Number -->
        <div class="field">
          <label for="regNumber">
            Register Number <span class="req" aria-hidden="true">*</span>
          </label>
          <div class="input-wrap">
            <!-- ID card icon -->
            <svg class="i-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
            <input
              type="text"
              id="regNumber"
              name="register_number"
              placeholder="e.g. RA2111003010042"
              autocomplete="username"
              aria-required="true"
              aria-describedby="err-reg"
            />
          </div>
          <span class="err-msg" id="err-reg" role="alert">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            Register number is required.
          </span>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">
            Password <span class="req" aria-hidden="true">*</span>
          </label>
          <div class="input-wrap">
            <!-- Lock icon -->
            <svg class="i-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              aria-required="true"
              aria-describedby="err-pwd"
              style="padding-right: 44px;"
            />
            <!-- Eye toggle -->
            <button
              type="button"
              class="pwd-toggle"
              id="pwdToggle"
              aria-label="Toggle password visibility"
              title="Show / hide password"
            >
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="err-msg" id="err-pwd" role="alert">
            <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            Password is required.
          </span>
        </div>

      </div><!-- /.form-fields -->

      <!-- Forgot password -->
      <div class="forgot-row" style="margin-top: 10px;">
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Submit button -->
      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-label" style="display: flex; align-items: center; gap: 9px;">
          <!-- Arrow right icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Sign In to CampusTrack
        </span>
        <div class="btn-spinner" aria-hidden="true"></div>
      </button>

      <!-- Divider -->
      <div class="divider"><span>or</span></div>

      <!-- Register link -->
      <div class="card-footer">
        Don't have an account?&nbsp;
        <a href="studentregistration.html">Create account →</a>
      </div>

      <!-- Trust strip -->
      <div class="trust-strip" aria-label="Security information">
        <div class="trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          256-bit SSL
        </div>
        <div class="trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          Encrypted
        </div>
        <div class="trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          Verified Portal
        </div>
      </div>

    </form>
  </div><!-- /.card-body -->
</div><!-- /.page-wrapper -->

<script>
'use strict';

/* ────────────────────────────────────────────
   CONFIG
──────────────────────────────────────────── */
const API_URL = "http://localhost:5000/api/auth/student/login";
const REDIRECT = 'studentdashboard.html';

/* ────────────────────────────────────────────
   DOM REFERENCES
──────────────────────────────────────────── */
const form      = document.getElementById('loginForm');
const regInput  = document.getElementById('regNumber');
const pwdInput  = document.getElementById('password');
const loginBtn  = document.getElementById('loginBtn');
const toast     = document.getElementById('toast');
const pwdToggle = document.getElementById('pwdToggle');
const eyeIcon   = document.getElementById('eyeIcon');

/* ────────────────────────────────────────────
   TOAST SYSTEM
──────────────────────────────────────────── */
function showToast(type, message) {

  const isSuccess = type === 'success';

  const iconSuccess = `
  <svg viewBox="0 0 20 20" fill="currentColor">
    <path fill-rule="evenodd"
      d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
  </svg>`;

  const iconError = `
  <svg viewBox="0 0 20 20" fill="currentColor">
    <path fill-rule="evenodd"
      d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"/>
  </svg>`;

  toast.innerHTML =
    (isSuccess ? iconSuccess : iconError) +
    `<span>${message}</span>`;

  toast.className =
    isSuccess ? 'toast-success' : 'toast-error';

  toast.style.display = 'flex';

  if (isSuccess) {
    setTimeout(() => {
      toast.style.display = 'none';
    }, 4000);
  }
}

function hideToast() {
  toast.style.display = 'none';
}

/* ────────────────────────────────────────────
   ERROR HANDLING
──────────────────────────────────────────── */
function setError(input, errId) {

  input.classList.add('has-error');

  const el = document.getElementById(errId);

  if (el) el.classList.add('show');
}

function clearError(input, errId) {

  input.classList.remove('has-error');

  const el = document.getElementById(errId);

  if (el) el.classList.remove('show');
}

/* ────────────────────────────────────────────
   LIVE CLEAR
──────────────────────────────────────────── */
regInput.addEventListener('input', () => {

  clearError(regInput, 'err-reg');
  hideToast();
});

pwdInput.addEventListener('input', () => {

  clearError(pwdInput, 'err-pwd');
  hideToast();
});

/* ────────────────────────────────────────────
   PASSWORD TOGGLE
──────────────────────────────────────────── */
pwdToggle.addEventListener('click', () => {

  const isHidden =
    pwdInput.type === 'password';

  pwdInput.type =
    isHidden ? 'text' : 'password';
});

/* ────────────────────────────────────────────
   LOADING STATE
──────────────────────────────────────────── */
function setLoading(on) {

  if (on) {

    loginBtn.classList.add('loading');
    loginBtn.disabled = true;

  } else {

    loginBtn.classList.remove('loading');
    loginBtn.disabled = false;
  }
}

/* ────────────────────────────────────────────
   VALIDATION
──────────────────────────────────────────── */
function validate() {

  let valid = true;

  if (!regInput.value.trim()) {

    setError(regInput, 'err-reg');
    valid = false;

  } else {

    clearError(regInput, 'err-reg');
  }

  if (!pwdInput.value) {

    setError(pwdInput, 'err-pwd');
    valid = false;

  } else {

    clearError(pwdInput, 'err-pwd');
  }

  return valid;
}

/* ────────────────────────────────────────────
   LOGIN SUBMIT
──────────────────────────────────────────── */
form.addEventListener('submit', async (e) => {

  e.preventDefault();

  hideToast();

  if (!validate()) return;

  const payload = {

    regNo: regInput.value.trim(),
    password: pwdInput.value
  };

  setLoading(true);

  try {

    const response = await fetch(API_URL, {

      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      body: JSON.stringify(payload)
    });

    const data = await response.json();

    console.log("LOGIN RESPONSE:", data);

    if (response.ok) {

      /* ─────────────────────────────
         SAFE STUDENT OBJECT
      ───────────────────────────── */
     const student = {
  name:            data.profile?.name                                    || "Student",
  register_number: data.profile?.reg_no                                  || "-",
  branch:          data.profile?.sections?.branches?.name                || "-",
  section:         data.profile?.sections?.name                          || "-",
  slot:            data.profile?.sections?.semester                      || "-",
  department:      data.profile?.sections?.branches?.departments?.name   || "-",
};

      console.log("SAVED STUDENT:", student);

      /* SAVE TOKEN */
     

      /* SAVE STUDENT DATA */
      localStorage.setItem(
        "studentData",
        JSON.stringify(student)
      );

      localStorage.setItem("studentProfile", JSON.stringify(data.profile));
localStorage.setItem("token",          data.token);

      /* LOGIN FLAG */
      localStorage.setItem(
        "isLoggedIn",
        "true"
      );

      showToast(
        "success",
        "🎉 Login successful!"
      );

      setTimeout(() => {

        window.location.href =
          REDIRECT;

      }, 1200);

    } else {

      showToast(
        'error',
        data.message ||
        'Invalid credentials'
      );

      pwdInput.value = '';
      pwdInput.focus();

      setLoading(false);
    }

  } catch (err) {

    console.error(err);

    showToast(
      'error',
      'Server error. Try again'
    );

    setLoading(false);
  }
});

/* ────────────────────────────────────────────
   ENTER KEY SUPPORT
──────────────────────────────────────────── */
[regInput, pwdInput].forEach(input => {

  input.addEventListener('keydown', (e) => {

    if (e.key === 'Enter') {

      e.preventDefault();

      form.dispatchEvent(
        new Event('submit')
      );
    }
  });
});
</script>
</body>
