

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Study Notes — CampusTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f1a;
  --surface:#111827;
  --card:#151d2e;
  --card2:#1a2438;
  --border:#1e2d47;
  --gold:#f0b429;
  --gold2:#ffd166;
  --text:#e8edf5;
  --text2:#8b9ab5;
  --text3:#4a5568;
  --accent:#3b82f6;
  --radius:16px;
}
html,body{min-height:100vh;background:var(--bg);font-family:'Outfit',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}

/* bg pattern */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 0%,rgba(240,180,41,.06) 0%,transparent 60%),radial-gradient(ellipse 40% 30% at 80% 100%,rgba(59,130,246,.05) 0%,transparent 60%);pointer-events:none;z-index:0}

/* topbar */
.topbar{position:sticky;top:0;z-index:100;background:rgba(11,15,26,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold);letter-spacing:.5px}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);text-decoration:none;transition:color .2s}
.back-btn:hover{color:var(--text)}
.back-btn svg{width:14px;height:14px}

/* page */
.page{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:48px 24px}

/* header */
.page-header{margin-bottom:40px}
.page-header-top{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.page-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#f0b429,#f59e0b);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(240,180,41,.3)}
.page-icon svg{width:24px;height:24px;color:#0b0f1a}
.page-title{font-family:'Playfair Display',serif;font-size:clamp(26px,4vw,36px);font-weight:700;color:var(--text);letter-spacing:-.5px}
.page-subtitle{font-size:14px;color:var(--text2);margin-left:68px}
.page-count{display:inline-flex;align-items:center;gap:6px;background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.2);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;color:var(--gold);margin-left:auto}

/* controls */
.controls{display:flex;gap:12px;margin-bottom:32px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text3)}
.search-input{width:100%;height:44px;padding:0 16px 0 40px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color .2s}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--gold)}
.sort-select{height:44px;padding:0 36px 0 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;color:var(--text2);outline:none;appearance:none;cursor:pointer;min-width:140px}

/* grid */
.resources-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}

/* card */
.resource-card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:24px;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;animation:fadeUp .4s ease both}
.resource-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));opacity:0;transition:opacity .25s}
.resource-card:hover{transform:translateY(-4px);box-shadow:0 20px 48px rgba(0,0,0,.4),0 0 0 1px rgba(240,180,41,.15);border-color:rgba(240,180,41,.2)}
.resource-card:hover::before{opacity:1}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.card-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.file-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;letter-spacing:.5px}
.fi-pdf{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.2)}
.fi-doc{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.2)}
.fi-ppt{background:rgba(234,88,12,.15);color:#fb923c;border:1px solid rgba(234,88,12,.2)}
.fi-zip{background:rgba(124,58,237,.15);color:#a78bfa;border:1px solid rgba(124,58,237,.2)}
.fi-file{background:rgba(139,154,181,.15);color:var(--text2);border:1px solid var(--border)}

.card-info{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-subject{font-size:12px;color:var(--gold);font-weight:500}

.section-badge{display:inline-flex;align-items:center;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.2);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;color:#60a5fa;margin-bottom:10px}

.card-desc{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.card-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.meta-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3)}
.meta-item svg{width:11px;height:11px}

.card-actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-decoration:none}
.btn-preview{background:rgba(240,180,41,.12);color:var(--gold);border:1px solid rgba(240,180,41,.2)}
.btn-preview:hover{background:rgba(240,180,41,.2);box-shadow:0 4px 12px rgba(240,180,41,.2)}
.btn-download{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.2)}
.btn-download:hover{background:rgba(59,130,246,.2)}
.btn svg{width:12px;height:12px}

/* skeleton */
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.skel-line{height:12px;border-radius:6px;margin-bottom:10px}
.skel-title{width:70%;height:16px;border-radius:6px;margin-bottom:8px}
.skel-short{width:40%}

/* empty */
.empty-state{text-align:center;padding:80px 20px;display:none}
.empty-state.visible{display:block}
.empty-icon{width:80px;height:80px;border-radius:50%;background:rgba(240,180,41,.08);border:2px solid rgba(240,180,41,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.empty-icon svg{width:32px;height:32px;color:var(--gold);opacity:.6}
.empty-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--text);margin-bottom:8px}
.empty-sub{font-size:13px;color:var(--text2)}

/* error */
.error-toast{position:fixed;bottom:24px;right:24px;background:#1a0a0a;border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:10px;font-size:13px;color:#f87171;z-index:1000;animation:slideIn .3s ease;display:none}
@keyframes slideIn{from{transform:translateX(120%)}to{transform:translateX(0)}}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;width:100%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:modalIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes modalIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-title{font-family:'Playfair Display',serif;font-size:17px;color:var(--text)}
.modal-close{width:32px;height:32px;border-radius:8px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);transition:all .2s}
.modal-close:hover{background:var(--border);color:var(--text)}
.modal-body{flex:1;overflow:auto;padding:24px}
.modal-iframe{width:100%;height:500px;border:none;border-radius:12px;background:var(--card)}
.modal-link-preview{text-align:center;padding:60px 20px}
.modal-link-preview a{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--gold);color:var(--bg);border-radius:10px;font-weight:600;text-decoration:none;font-size:14px}

@media(max-width:640px){.page{padding:32px 16px}.controls{flex-direction:column}.resources-grid{grid-template-columns:1fr}.topbar{padding:0 16px}}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">CampusTrack</span>
  <a class="back-btn" href="studentdashboard.html">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    Dashboard
  </a>
</div>

<div class="page">
  <div class="page-header">
    <div class="page-header-top">
      <div class="page-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <h1 class="page-title">Study Notes</h1>
      <div class="page-count" id="resourceCount">0 notes</div>
    </div>
    <p class="page-subtitle">Course notes and study materials uploaded by your faculty</p>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="Search notes…"/>
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="title">By title</option>
    </select>
  </div>

  <div class="resources-grid" id="resourcesGrid"></div>
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
    </div>
    <div class="empty-title">No Notes Yet</div>
    <p class="empty-sub">Your faculty hasn't uploaded any notes for your section yet. Check back later.</p>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Preview</span>
      <button class="modal-close" onclick="closeModal()">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="error-toast" id="errorToast">
  <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <span id="errorMsg"></span>
</div>

<script>
'use strict';

const BASE_URL = 'https://campustrack-backend-2.onrender.com/api';
const token    = localStorage.getItem('token');
const PAGE_TYPE = 'NOTES';

if (!token) window.location.href = 'studentlogin.html';

let studentProfile = {};
try { studentProfile = JSON.parse(localStorage.getItem('studentProfile') || '{}'); } catch(_) {}

const sectionId = studentProfile.section_id || studentProfile.sections?.id || null;

let allResources = [];

/* ── Helpers ── */
function getFileIconClass(url) {
  if (!url) return 'fi-file';
  const ext = url.split('.').pop().toLowerCase();
  if (['pdf'].includes(ext)) return 'fi-pdf';
  if (['doc','docx'].includes(ext)) return 'fi-doc';
  if (['ppt','pptx'].includes(ext)) return 'fi-ppt';
  if (['zip','rar'].includes(ext)) return 'fi-zip';
  return 'fi-file';
}

function getFileLabel(url) {
  if (!url) return 'FILE';
  const ext = url.split('.').pop().toUpperCase();
  return ext.slice(0,4) || 'FILE';
}

function formatDate(str) {
  if (!str) return '';
  return new Date(str).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

/* ── Skeleton loading ── */
function showSkeletons() {
  const grid = document.getElementById('resourcesGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    grid.innerHTML += `
      <div class="skel-card">
        <div style="display:flex;gap:14px;margin-bottom:16px">
          <div class="skeleton" style="width:46px;height:46px;border-radius:12px;flex-shrink:0"></div>
          <div style="flex:1">
            <div class="skeleton skel-title"></div>
            <div class="skeleton skel-line skel-short"></div>
          </div>
        </div>
        <div class="skeleton skel-line" style="width:30%;height:20px;border-radius:6px;margin-bottom:12px"></div>
        <div class="skeleton skel-line"></div>
        <div class="skeleton skel-line" style="width:80%"></div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <div class="skeleton" style="height:34px;border-radius:8px;flex:1"></div>
          <div class="skeleton" style="height:34px;border-radius:8px;flex:1"></div>
        </div>
      </div>`;
  }
}

/* ── Fetch resources ── */
async function loadResources() {
  if (!sectionId) {
    showError('Student section not found. Please log in again.');
    return;
  }

  showSkeletons();

  try {
    const res  = await fetch(
      `${BASE_URL}/resources/student?section_id=${sectionId}&file_type=${PAGE_TYPE}`,
      { headers: { 'Authorization': `Bearer ${token}` } }
    );

    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const data = await res.json();

    allResources = Array.isArray(data) ? data : [];
    renderResources();

  } catch (err) {
    showError('Failed to load notes: ' + err.message);
    document.getElementById('resourcesGrid').innerHTML = '';
    document.getElementById('emptyState').classList.add('visible');
  }
}

/* ── Render ── */
function renderResources() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const sort  = document.getElementById('sortSelect').value;

  let list = allResources.filter(r =>
    !query || (r.title || '').toLowerCase().includes(query) ||
    (r.description || '').toLowerCase().includes(query)
  );

  if (sort === 'oldest') list.sort((a,b) => new Date(a.uploaded_at) - new Date(b.uploaded_at));
  else if (sort === 'title') list.sort((a,b) => (a.title||'').localeCompare(b.title||''));
  else list.sort((a,b) => new Date(b.uploaded_at) - new Date(a.uploaded_at));

  const grid  = document.getElementById('resourcesGrid');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('resourceCount');

  grid.innerHTML = '';
  count.textContent = `${list.length} note${list.length !== 1 ? 's' : ''}`;

  if (!list.length) { empty.classList.add('visible'); return; }
  empty.classList.remove('visible');

  list.forEach((r, idx) => {
    const card = document.createElement('div');
    card.className = 'resource-card';
    card.style.animationDelay = (idx * 0.07) + 's';

    const iconClass = getFileIconClass(r.file_url);
    const iconLabel = getFileLabel(r.file_url);
    const staffName = r.staff_subject_assignments?.staff?.name || 'Faculty';
    const secName   = r.section || r.staff_subject_assignments?.sections?.name || '';
    const subName   = r.subject || r.staff_subject_assignments?.subjects?.name || '';

    card.innerHTML = `
      <div class="card-top">
        <div class="file-icon ${iconClass}">${iconLabel}</div>
        <div class="card-info">
          <div class="card-title" title="${r.title}">${r.title}</div>
          <div class="card-subject">${subName}</div>
        </div>
      </div>
      ${secName ? `<div class="section-badge">Section ${secName}</div>` : ''}
      ${r.description ? `<div class="card-desc">${r.description}</div>` : ''}
      <div class="card-meta">
        <div class="meta-item">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          ${formatDate(r.uploaded_at)}
        </div>
        <div class="meta-item">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          ${staffName}
        </div>
      </div>
      <div class="card-actions">
        <button class="btn btn-preview" onclick="openPreview('${r.id}')">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Preview
        </button>
        ${r.file_url ? `<a class="btn btn-download" href="${r.file_url}" target="_blank" download>
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </a>` : ''}
      </div>`;

    grid.appendChild(card);
  });
}

/* ── Preview modal ── */
function openPreview(id) {
  const r = allResources.find(x => x.id === id);
  if (!r) return;

  document.getElementById('modalTitle').textContent = r.title;
  const body = document.getElementById('modalBody');
  const url  = r.file_url || '';

  if (!url) {
    body.innerHTML = `<div class="modal-link-preview"><p style="color:var(--text2);margin-bottom:20px">No preview available for this resource.</p></div>`;
  } else if (url.toLowerCase().endsWith('.pdf')) {
    body.innerHTML = `<iframe class="modal-iframe" src="${url}" title="${r.title}"></iframe>`;
  } else if (/\.(jpg|jpeg|png|gif|webp)$/i.test(url)) {
    body.innerHTML = `<img src="${url}" style="width:100%;border-radius:12px;max-height:500px;object-fit:contain" alt="${r.title}"/>`;
  } else if (url.startsWith('http')) {
    body.innerHTML = `<div class="modal-link-preview">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="var(--gold)" stroke-width="1.5" style="margin-bottom:16px"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
      <p style="color:var(--text2);margin-bottom:20px;font-size:14px">This resource opens as an external link.</p>
      <a href="${url}" target="_blank" rel="noopener">Open Resource ↗</a>
    </div>`;
  } else {
    body.innerHTML = `<iframe class="modal-iframe" src="${url}" title="${r.title}"></iframe>`;
  }

  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
  document.getElementById('modalBody').innerHTML = '';
}

document.getElementById('modalBackdrop').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── Error ── */
function showError(msg) {
  const t = document.getElementById('errorToast');
  document.getElementById('errorMsg').textContent = msg;
  t.style.display = 'flex';
  setTimeout(() => { t.style.display = 'none'; }, 5000);
}

/* ── Events ── */
document.getElementById('searchInput').addEventListener('input', renderResources);
document.getElementById('sortSelect').addEventListener('change', renderResources);

/* ── Boot ── */
loadResources();
</script>
</body>
</html>
